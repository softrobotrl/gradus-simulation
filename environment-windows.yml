# Native Windows variant of environment.yml (no WSL needed).
#   conda env create -f environment-windows.yml
# PyTorch gets CUDA (SAC networks and replay buffer on the NVIDIA GPU). JAX has no CUDA build for native Windows,
# so the MJX physics runs on the CPU; use WSL2 + environment.yml to run the physics on the GPU too.
name: gradus-rl
channels:
  - conda-forge
  - nodefaults  # skip repo.anaconda.com (new Miniconda requires a ToS acceptance for it)
dependencies:
  - python=3.11
  - numpy
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu126
    - "torch==2.14.1+cu126"  # +cu126 forces the CUDA wheel; unpinned, pip picks the newer CPU build from PyPI
    - tensordict==0.10.0
    - rsl-rl-lib==5.5.1  # walking_box / genesis_leg PPO
    - imageio  # walking_box.evaluate GIFs
    - onshape-to-robot  # mujoco_to_mjcf.build
    - tensorboard
    - matplotlib
    - pyyaml
    - "pydantic>=2"
    # STL -> MJCF -> MJX pipeline (see pipeline/README.md)
    - mujoco==3.14.0
    - mujoco-mjx==3.14.0
    - jax==0.6.2  # CPU; same pin as environment.yml
    - trimesh
    - networkx
    - scipy
