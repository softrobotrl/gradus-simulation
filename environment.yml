name: gradus-rl
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu126
    - "torch>=2.8.0"
    - torchvision
    - torchaudio
    - genesis-world
    - gymnasium
    - tensorboard
    - matplotlib
    - "rsl-rl-lib>=5.0.0"
    # STL -> MJCF -> MJX pipeline (see pipeline/README.md)
    - mujoco==3.14.0
    - mujoco-mjx==3.14.0
    - "jax[cuda12]==0.6.2"  # pinned: jax 0.10 compiled MJX >50x slower in testing; falls back to CPU without a GPU
    - trimesh
    - networkx
    - scipy
    - pyyaml
    - pydantic>=2
