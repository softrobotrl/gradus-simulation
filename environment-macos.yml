name: gradus-rl
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy
  - pip
  - pip:
    - torch==2.8.0
    - torchvision==0.23.0
    - torchaudio==2.8.0
    - genesis-world==1.4.3
    - rsl-rl-lib==5.5.1
    - tensordict==0.10.0
    - gymnasium
    - tensorboard
    - matplotlib
    # STL -> MJCF -> MJX pipeline (see pipeline/README.md)
    - mujoco==3.14.0
    - mujoco-mjx==3.14.0
    - jax==0.6.2  # pinned: jax 0.10 compiled MJX >50x slower in testing
    - trimesh
    - networkx
    - scipy
    - pyyaml
    - pydantic>=2
